name: Daily Research Digest

on:
  schedule:
    - cron: "0 14 * * *" # 7am Mountain Time (MDT). See README for other timezones.
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_INTERESTS: ${{ secrets.RESEARCH_INTERESTS }}
          ARXIV_QUERIES: ${{ secrets.ARXIV_QUERIES }}
          OSTI_KEYWORDS: ${{ secrets.OSTI_KEYWORDS }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python main.py

      - name: Save seen links back to repo
        run: |
          git config user.name "research-digest-bot"
          git config user.email "actions@github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "update seen links [skip ci]"
          git push
