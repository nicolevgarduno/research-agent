name: Daily Research Digest

on:
  schedule:
    - cron: "0 14 * * *"  # 7:00am Mountain Time (UTC-7) / adjust to 15 in winter (MST = UTC-6)
  workflow_dispatch:       # allows manual trigger from GitHub UI for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ICLOUD_ADDRESS: ${{ secrets.ICLOUD_ADDRESS }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: python main.py
