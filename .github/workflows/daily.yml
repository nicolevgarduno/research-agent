name: Daily Research Digest

on:
  schedule:
    - cron: "0 10 * * *" # 7am MDT
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ICLOUD_ADDRESS: ${{ secrets.ICLOUD_ADDRESS }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: python main.py

      - name: Save seen links back to repo
        run: |
          git config user.name "research-digest-bot"
          git config user.email "actions@github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "update seen links [skip ci]"
          git push
